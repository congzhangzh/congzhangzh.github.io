name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push does not cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - name: Install Hugo
        run: |
          base=https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}
          wget -q "$base/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c
          tar -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          sudo install -m755 hugo /usr/local/bin/hugo
          hugo version
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0   # enableGitInfo: last-modified dates come from git
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
